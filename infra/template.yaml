AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Minimal AutoML - Lambda API, SQS, EC2 workers, S3 and DynamoDB
Metadata:
  cfn-lint:
    config:
      # SAM-generated usage-plan resources contain redundant DependsOn entries.
      ignore_checks: [W3005]
Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI with immutable digest (same image for Lambda and EC2)
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in the selected VPC, with a route to an Internet Gateway
  WorkerInstanceType:
    Type: String
    Default: t3.large
  MaxWorkers:
    Type: Number
    Default: 2
    MinValue: 1
  WorkerAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional email for monthly budget alert
Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]
Globals:
  Function:
    Architectures: [x86_64]
    Timeout: 28
    MemorySize: 512
    Environment:
      Variables:
        BUCKET_NAME: !Ref DataBucket
        TABLE_NAME: !Ref StateTable
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 3600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Throttle: {BurstLimit: 10, RateLimit: 5}
  Controller:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig: {Command: [app.controller.handler]}
      Environment:
        Variables:
          QUEUE_URL: !Ref JobQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${DataBucket.Arn}/datasets/*'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt StateTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobQueue.Arn
      Events:
        Jobs:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /jobs, Method: post}
        Status:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/jobs/{id}', Method: get}
        Deploy:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /deploy, Method: post}
  Predict:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig: {Command: [app.predict.handler]}
      MemorySize: 2048
      EphemeralStorage: {Size: 2048}
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${DataBucket.Arn}/models/*'
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt StateTable.Arn
      Events:
        Predict:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/predict/{id}', Method: post}
  ControllerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Controller}'
      RetentionInDays: 7
  PredictLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Predict}'
      RetentionInDays: 7
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage]
                Resource: !GetAtt JobQueue.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WorkerLogs.Arn
  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AutoML workers - no inbound access
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  WorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref WorkerAmi
        InstanceType: !Ref WorkerInstanceType
        IamInstanceProfile: {Arn: !GetAtt WorkerProfile.Arn}
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref WorkerSecurityGroup]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            dnf install -y docker
            systemctl enable --now docker
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            docker pull ${ImageUri}
            docker run -d --name automl-worker --restart always \
              --log-driver awslogs --log-opt awslogs-region=${AWS::Region} \
              --log-opt awslogs-group=${WorkerLogs} \
              -e AWS_DEFAULT_REGION=${AWS::Region} \
              -e BUCKET_NAME=${DataBucket} -e TABLE_NAME=${StateTable} \
              -e QUEUE_URL=${JobQueue} \
              --entrypoint python ${ImageUri} -m app.worker
  Workers:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '0'
      MaxSize: !Ref MaxWorkers
      DesiredCapacity: '0'
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref WorkerLaunchTemplate
        Version: !GetAtt WorkerLaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-worker', PropagateAtLaunch: true}
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT5M
  ScaleOut:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Workers
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: '300'
  ScaleToZero:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Workers
      AdjustmentType: ExactCapacity
      ScalingAdjustment: 0
      Cooldown: '300'
  QueueHasWork:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt JobQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScaleOut]
  QueueIdle:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # Include in-flight jobs: a worker training a model must not look idle.
      Metrics:
        - Id: total
          Expression: visible + busy
          ReturnData: true
        - Id: visible
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt JobQueue.QueueName}]
            Period: 60
            Stat: Maximum
        - Id: busy
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesNotVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt JobQueue.QueueName}]
            Period: 60
            Stat: Maximum
      EvaluationPeriods: 15
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScaleToZero]
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 10, Unit: USD}
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ApiKeyId:
    Value: !Ref ApiApiKey
  BucketName:
    Value: !Ref DataBucket
  WorkerGroup:
    Value: !Ref Workers
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
