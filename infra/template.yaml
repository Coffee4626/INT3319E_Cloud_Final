AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stratus AutoML - authenticated API, datasets, training, deployment and prediction
Metadata:
  cfn-lint:
    config:
      # SAM-generated permissions repeat ApiEnabled and add redundant dependencies.
      ignore_checks: [W3005, W1028]
Parameters:
  EnableApi:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false to provision storage, queue and workers before the API layer
  ImageUri:
    Type: String
    Description: ECR image URI with immutable digest (same image for Lambda and EC2)
  ControllerImageUri:
    Type: String
    Default: ''
    Description: Optional controller-only image built from ImageUri without changing ML dependencies
  WorkerImageUri:
    Type: String
    Default: ''
    Description: Optional worker code overlay with unchanged ML dependencies
  InferenceImageUri:
    Type: String
    Default: ''
    Description: Optional inference service code image built from the unchanged model ImageUri
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in the selected VPC, with a route to an Internet Gateway
  WorkerInstanceType:
    Type: String
    Default: t3.large
  MaxWorkers:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Frontend origin without trailing slash
  WorkerAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional email for monthly budget alert
  ControlMemoryMB:
    Type: Number
    Default: 1024
    MinValue: 128
    MaxValue: 10240
    Description: Memory for controller and DLQ Lambda functions; new accounts may allow only 512 MB
  PredictMemoryMB:
    Type: Number
    Default: 2048
    MinValue: 128
    MaxValue: 10240
    Description: Inference Lambda memory; fit this to the account quota and model size
  InferenceMode:
    Type: String
    Default: lambda
    AllowedValues: [lambda, ec2]
    Description: Run models inside Lambda or on private EC2 behind the same API
  InferenceInstanceType:
    Type: String
    Default: m7i-flex.large
Conditions:
  HasWorkerImage: !Not [!Equals [!Ref WorkerImageUri, '']]
  HasInferenceImage: !Not [!Equals [!Ref InferenceImageUri, '']]
  HasControllerImage: !Not [!Equals [!Ref ControllerImageUri, '']]
  ApiEnabled: !Equals [!Ref EnableApi, 'true']
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]
  Ec2Inference: !And [!Equals [!Ref EnableApi, 'true'], !Equals [!Ref InferenceMode, ec2]]
Globals:
  Function:
    Architectures: [x86_64]
    Timeout: 28
    MemorySize: !Ref ControlMemoryMB
    Environment:
      Variables:
        BUCKET_NAME: !Ref DataBucket
        TABLE_NAME: !Ref StateTable
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        AUTH_REQUIRED: 'true'
        MODEL_IMAGE_URI: !Ref ImageUri
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [POST]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 900
      LifecycleConfiguration:
        Rules:
          - Id: expire-staging-uploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt DataBucket.Arn, !Sub '${DataBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
        - {AttributeName: scope, AttributeType: S}
        - {AttributeName: created_id, AttributeType: S}
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: by-owner
          KeySchema: [{AttributeName: scope, KeyType: HASH}, {AttributeName: created_id, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 3600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
  UserPool:
    Condition: ApiEnabled
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
  UserPoolClient:
    Condition: ApiEnabled
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${AllowedOrigin}/auth/callback']
      LogoutURLs: [!Ref AllowedOrigin]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
  UserPoolDomain:
    Condition: ApiEnabled
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool
  Api:
    Condition: ApiEnabled
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type,Authorization,X-Api-Key'"
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Api-Key'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
          MetricsEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              ValidationExpression: !Ref UserPoolClient
  Controller:
    Condition: ApiEnabled
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !If [HasControllerImage, !Ref ControllerImageUri, !Ref ImageUri]
      Timeout: 600
      EphemeralStorage: {Size: 1024}
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 120
        MaximumRetryAttempts: 0
      ImageConfig: {Command: [app.controller.handler]}
      Environment:
        Variables:
          QUEUE_URL: !Ref JobQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: [!Sub '${DataBucket.Arn}/datasets/*', !Sub '${DataBucket.Arn}/uploads/*']
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource: [!GetAtt StateTable.Arn, !Sub '${StateTable.Arn}/index/*']
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobQueue.Arn
      Events:
        Jobs:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /jobs, Method: post}
        Status:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/jobs/{id}', Method: get}
        Deploy:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /deploy, Method: post}
        ListJobs:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /jobs, Method: get}
        JobActions:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/jobs/{id}/{action}', Method: post}
        Uploads:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /uploads, Method: post}
        Datasets:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /datasets, Method: get}
        Dataset:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/datasets/{id}', Method: get}
        DatasetAction:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/datasets/{id}/{action}', Method: post}
        Deployments:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /deployments, Method: get}
        Deployment:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/deployments/{id}', Method: get}
        Revoke:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/deployments/{id}', Method: delete}
        Rotate:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/deployments/{id}/key', Method: post}
        Health:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /health, Method: get}
  ControllerSelfInvoke:
    Condition: ApiEnabled
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: process-large-csv
      Roles: [!Ref ControllerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt Controller.Arn
  ComputeStatus:
    Condition: ApiEnabled
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          WORKER_GROUP: !Ref Workers
          QUEUE_URL: !Ref JobQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: autoscaling:DescribeAutoScalingGroups
              Resource: '*'
            - Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource: !GetAtt JobQueue.Arn
      InlineCode: |
        import json
        import logging
        import os
        import time
        import boto3
        from botocore.config import Config

        def handler(event, context):
            headers = {"Content-Type": "application/json", "Cache-Control": "no-store",
                       "Access-Control-Allow-Origin": os.environ["ALLOWED_ORIGIN"], "Vary": "Origin"}
            def reply(code, data):
                return {"statusCode": code, "headers": headers, "body": json.dumps(data)}
            claims = event.get("requestContext", {}).get("authorizer", {}).get("claims", {})
            if not claims.get("sub"):
                return reply(401, {"error": "Sign in to continue"})
            try:
                options = Config(connect_timeout=2, read_timeout=2, retries={"total_max_attempts": 1})
                groups = boto3.client("autoscaling", config=options).describe_auto_scaling_groups(
                    AutoScalingGroupNames=[os.environ["WORKER_GROUP"]])["AutoScalingGroups"]
                if not groups:
                    return reply(503, {"error": "Worker group unavailable"})
                group = groups[0]
                instances = group["Instances"]
                queue = boto3.client("sqs", config=options).get_queue_attributes(
                    QueueUrl=os.environ["QUEUE_URL"], AttributeNames=[
                        "ApproximateNumberOfMessages", "ApproximateNumberOfMessagesNotVisible"])["Attributes"]
                return reply(200, {
                    "observed_at": int(time.time()),
                    "workers": {"total": len(instances), "desired": group["DesiredCapacity"],
                        "maximum": group["MaxSize"],
                        "in_service": sum(i["LifecycleState"] == "InService" for i in instances),
                        "starting": sum(i["LifecycleState"].startswith("Pending") for i in instances)},
                    "queue": {"waiting": int(queue["ApproximateNumberOfMessages"]),
                              "processing": int(queue["ApproximateNumberOfMessagesNotVisible"])}})
            except Exception:
                logging.exception("Compute status read failed")
                return reply(503, {"error": "Compute status temporarily unavailable"})
      Events:
        Compute:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /compute, Method: get}
  Predict:
    Condition: ApiEnabled
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig: {Command: [app.predict.handler]}
      MemorySize: !Ref PredictMemoryMB
      EphemeralStorage: {Size: 2048}
      VpcConfig: !If
        - Ec2Inference
        - SecurityGroupIds: [!Ref InferenceProxySecurityGroup]
          SubnetIds: !Ref SubnetIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          INFERENCE_URL: !If [Ec2Inference, !Sub 'http://${InferenceInstance.PrivateIp}:8080', '']
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${DataBucket.Arn}/models/*'
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt StateTable.Arn
      Events:
        Predict:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: '/predict/{id}'
            Method: post
            Auth: {Authorizer: NONE}
  InferenceLifecycle:
    Condition: Ec2Inference
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !If [HasInferenceImage, !Ref InferenceImageUri, !Ref ImageUri]
      ImageConfig: {Command: [app.inference_lifecycle.handler]}
      Timeout: 120
      Environment:
        Variables:
          INFERENCE_INSTANCE_ID: !Ref InferenceInstance
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Scan]
              Resource: !GetAtt StateTable.Arn
            - Effect: Allow
              Action: ec2:StopInstances
              Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InferenceInstance}'
      Events:
        Hourly:
          Type: Schedule
          Properties: {Schedule: 'rate(1 hour)', Enabled: true}
  InferenceLifecycleLogs:
    Condition: Ec2Inference
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${InferenceLifecycle}'
      RetentionInDays: 7
  DlqProcessor:
    Condition: ApiEnabled
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig: {Command: [app.dlq.handler]}
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt StateTable.Arn
      Events:
        DeadLetters:
          Type: SQS
          Properties:
            Queue: !GetAtt DeadLetterQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
  DlqLogs:
    Condition: ApiEnabled
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DlqProcessor}'
      RetentionInDays: 14
  ControllerLogs:
    Condition: ApiEnabled
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Controller}'
      RetentionInDays: 7
  PredictLogs:
    Condition: ApiEnabled
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Predict}'
      RetentionInDays: 7
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  InferenceLogs:
    Condition: Ec2Inference
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  InferenceProxySecurityGroup:
    Condition: Ec2Inference
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda proxy - private inference egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref InferenceSecurityGroup
  InferenceSecurityGroup:
    Condition: Ec2Inference
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private inference - no public inbound or SSH
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  InferenceIngress:
    Condition: Ec2Inference
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InferenceSecurityGroup
      SourceSecurityGroupId: !Ref InferenceProxySecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
  InferenceRole:
    Condition: Ec2Inference
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inference
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DataBucket.Arn}/models/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt InferenceLogs.Arn
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId
  InferenceProfile:
    Condition: Ec2Inference
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InferenceRole]
  InferenceLaunchTemplate:
    Condition: Ec2Inference
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref WorkerAmi
        InstanceType: !Ref InferenceInstanceType
        IamInstanceProfile: {Arn: !GetAtt InferenceProfile.Arn}
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            SubnetId: !Select [0, !Ref SubnetIds]
            Groups: [!Ref InferenceSecurityGroup]
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                set -euo pipefail
                dnf install -y docker
                systemctl enable --now docker
                TOKEN=$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' http://169.254.169.254/latest/api/token)
                INSTANCE_ID=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                docker pull ${ServiceImage}
                docker run -d --name automl-inference --restart always -p 8080:8080 \
                  --log-driver awslogs --log-opt awslogs-region=${AWS::Region} \
                  --log-opt awslogs-group=${InferenceLogs} \
                  -e AWS_DEFAULT_REGION=${AWS::Region} \
                  -e BUCKET_NAME=${DataBucket} -e TABLE_NAME=${StateTable} \
                  -e ALLOWED_ORIGIN=${AllowedOrigin} -e MODEL_IMAGE_URI=${ImageUri} \
                  -e INFERENCE_ACTIVITY_ENABLED=true -e OMP_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=2 \
                  --entrypoint python ${ServiceImage} -m app.inference_server
                for attempt in $(seq 1 120); do
                  if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
                    aws cloudformation signal-resource --region ${AWS::Region} --stack-name ${AWS::StackName} --logical-resource-id InferenceInstance --unique-id "$INSTANCE_ID" --status SUCCESS
                    exit 0
                  fi
                  sleep 5
                done
                aws cloudformation signal-resource --region ${AWS::Region} --stack-name ${AWS::StackName} --logical-resource-id InferenceInstance --unique-id "$INSTANCE_ID" --status FAILURE
                exit 1
              - ServiceImage: !If [HasInferenceImage, !Ref InferenceImageUri, !Ref ImageUri]
  InferenceInstance:
    Condition: Ec2Inference
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal: {Count: 1, Timeout: PT15M}
    Properties:
      # Referencing the version forces replacement when the runtime image changes.
      LaunchTemplate:
        LaunchTemplateId: !Ref InferenceLaunchTemplate
        Version: !GetAtt InferenceLaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-inference'}
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DataBucket.Arn}/datasets/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${DataBucket.Arn}/models/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility]
                Resource: !GetAtt JobQueue.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WorkerLogs.Arn
              - Effect: Allow
                Action: autoscaling:SetInstanceProtection
                Resource: !Sub 'arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-workers'
  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AutoML workers - no inbound access
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  WorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref WorkerAmi
        InstanceType: !Ref WorkerInstanceType
        IamInstanceProfile: {Arn: !GetAtt WorkerProfile.Arn}
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 50, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref WorkerSecurityGroup]
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                set -euo pipefail
                dnf install -y docker
                systemctl enable --now docker
                TOKEN=$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' http://169.254.169.254/latest/api/token)
                INSTANCE_ID=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                docker pull ${WorkerImage}
                docker run -d --name automl-worker --restart always \
                  --log-driver awslogs --log-opt awslogs-region=${AWS::Region} \
                  --log-opt awslogs-group=${WorkerLogs} \
                  -e AWS_DEFAULT_REGION=${AWS::Region} \
                  -e BUCKET_NAME=${DataBucket} -e TABLE_NAME=${StateTable} \
                  -e QUEUE_URL=${JobQueue} \
                  -e MODEL_IMAGE_URI=${ImageUri} \
                  -e WORKER_GROUP=${AWS::StackName}-workers -e INSTANCE_ID="$INSTANCE_ID" \
                  --entrypoint python ${WorkerImage} -m app.worker
              - WorkerImage: !If [HasWorkerImage, !Ref WorkerImageUri, !Ref ImageUri]
  Workers:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-workers'
      MinSize: '0'
      MaxSize: !Ref MaxWorkers
      DesiredCapacity: '0'
      HealthCheckGracePeriod: 600
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref WorkerLaunchTemplate
        Version: !GetAtt WorkerLaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-worker', PropagateAtLaunch: true}
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT5M
  ScaleOut:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Workers
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      EstimatedInstanceWarmup: 180
      MetricAggregationType: Maximum
      StepAdjustments:
        - {MetricIntervalLowerBound: 0, MetricIntervalUpperBound: 2, ScalingAdjustment: 1}
        - {MetricIntervalLowerBound: 2, MetricIntervalUpperBound: 3, ScalingAdjustment: 2}
        - {MetricIntervalLowerBound: 3, ScalingAdjustment: 3}
  ScaleToZero:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Workers
      AdjustmentType: ExactCapacity
      ScalingAdjustment: 0
      Cooldown: '300'
  QueueHasWork:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt JobQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScaleOut]
  QueueIdle:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # Include in-flight jobs: a worker training a model must not look idle.
      Metrics:
        - Id: total
          Expression: visible + busy
          ReturnData: true
        - Id: visible
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt JobQueue.QueueName}]
            Period: 60
            Stat: Maximum
        - Id: busy
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesNotVisible
              Dimensions: [{Name: QueueName, Value: !GetAtt JobQueue.QueueName}]
            Period: 60
            Stat: Maximum
      EvaluationPeriods: 15
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScaleToZero]
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 10, Unit: USD}
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Training queue has waited more than 20 minutes; inspect worker launch and ECR access
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt JobQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  PredictErrorsAlarm:
    Condition: ApiEnabled
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref Predict}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  InferenceMode:
    Value: !Ref InferenceMode
  InferenceInstanceId:
    Condition: Ec2Inference
    Value: !Ref InferenceInstance
  InferenceLogGroup:
    Condition: Ec2Inference
    Value: !Ref InferenceLogs
  ApiUrl:
    Condition: ApiEnabled
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  UserPoolId:
    Condition: ApiEnabled
    Value: !Ref UserPool
  UserPoolClientId:
    Condition: ApiEnabled
    Value: !Ref UserPoolClient
  CognitoDomain:
    Condition: ApiEnabled
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  BucketName:
    Value: !Ref DataBucket
  WorkerGroup:
    Value: !Ref Workers
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  QueueUrl:
    Value: !Ref JobQueue
  TableName:
    Value: !Ref StateTable
  WorkerLogGroup:
    Value: !Ref WorkerLogs
  ImageUri:
    Value: !Ref ImageUri
